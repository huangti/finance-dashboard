<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <!-- Grid lines -->
  <line x1="8" y1="46" x2="56" y2="46" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="8" y1="30" x2="56" y2="30" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="2 2" />
  <!-- Area gradient under curve -->
  <path d="M 10 44 L 22 34 L 32 38 L 44 20 L 54 14 L 54 50 L 10 50 Z" fill="url(#lineGrad)" opacity="0.15" />
  <!-- Trend chart line -->
  <path d="M 10 44 L 22 34 L 32 38 L 44 20 L 54 14" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Arrow peak dot -->
  <circle cx="54" cy="14" r="3.5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="54" cy="14" r="1.8" fill="#ffffff" />
</svg>
